server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # ✅ AUTH / USER SERVICE
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**,/users/**,/admin/**

        # ✅ VET SERVICE
        - id: vet-service
          uri: http://localhost:8082
          predicates:
            - Path=/vets/**

        # ✅ PET SERVICE
        - id: pet-service
          uri: http://localhost:8083
          predicates:
            - Path=/pets/**

        # ✅ APPOINTMENT SERVICE
        - id: appointment-service
          uri: http://localhost:8084
          predicates:
            - Path=/appointments/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO