server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:mysql://${DB_HOST:shared-mysql}:${DB_PORT:3306}/${DATABASE:vet_clinic_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8762}/eureka/
